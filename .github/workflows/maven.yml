
name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Instalar dependências do Node
      run: npm install -g serverest

    - name: Iniciar Serverest em background
      run: |
          nohup npx serverest@latest > serverest.log 2>&1 &
          sleep 5 # Espera o server subir

    - name: Maven Clean
      run: mvn clean

    - name: Maven Install
      run: mvn install -DskipTests=true

    - name: Run tests
      run: mvn test || { echo 'Testes falharam'; exit 1; }
